        .modal-title {
            font-family: Georgia, serif;
            color: var(--accent);
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 1.5rem;

            min-height: 2.5rem;

        }

        .cursor {

            width: 8px;
            height: 1.2rem;
            background-color: var(--accent);

            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;

        }
        .submodal-overlay.show {

            pointer-events: auto;
        }
        
        .submodal-content {

        .submodal-close {

            top: -40px; right: -40px;
            color: var(--accent);
            font-size: 2.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .submodal-close:hover { transform: scale(1.2); }

        /* Pie de página */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0.4rem 2rem;
            background-color: rgba(11, 19, 41, 0.2);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);

            transition: filter 0.5s ease;
        }

        footer p {
            color: #ffffff;
        }
    </style>
</head>

    <script>
        /* BASE DE DATOS DE LA SECUENCIA */
        const storyData = [
            {
                title: "01. EL MITO QUE DIO NOMBRE AL INSTITUTO.",
                text: "Mucho antes de convertirse en el nombre de un instituto dedicado al conocimiento, Quimera pertenecía al mundo de la mitología griega.\nSu historia es la de un ser extraordinario y monstruoso que, según las fuentes antiguas, habitaba en Licia. Quimera era descrita como una criatura híbrida, asociada con diferentes formas animales: tenía elementos de león, cabra y serpiente, y se distinguía por su capacidad de arrojar fuego.\nSu propia naturaleza era una combinación de partes que, aparentemente, no deberían coexistir.\nPrecisamente ahí reside una de las características más interesantes de sus mito: Quimera es una representación de lo compuesto, lo complejo y lo que no puede comprenderse desde una sola perspectiva.\nNo era simplemente un animal poderoso. Era una criatura cuya naturaleza exigía reconocer simultáneamente diferentes elementos."
            },
            {
                title: "02. BELEROFONTE.",
                text: "La figura destinada a enfrentarse con Quimera fue Belerofonte, héroe de la mitología griega.\nSegún la tradición, Belerofonte recibió del rey Yóbates de Licia el encargo de matar a la criatura.\nLa tarea parecía extraordinariamente difícil.\nQuimera no podía enfrentarse como si fuera un enemigo ordinario. Su fuerza, su naturaleza híbrida y su capacidad de lanzar fuego convertían el enfrentamiento en un problema que requería algo más que fuerza física.\nBelerofonte contó con una ventaja decisiva: Pegaso, el caballo alado.\nMontado sobre Pegaso, pudo aproximarse a Quimera desde una posición que le permitía evitar directamente sus ataques y encontrar una estrategia para derrotarla.\nLa tradición relata que Belerofonte utilizó una lanza cuya punta había sido adaptada con plomo. Al enfrentarse a la criatura, el calor de su fuego derritió el metal, que penetró en ella y provocó su muerte.\nEl héroe no venció a Quimera simplemente porque fuera más fuerte. La venció porque encontró una forma diferente de abordar el problema."
            },
            {
                title: "03. QUIMERA FRENTE A BELEROFONTE.",
                text: "El mito puede leerse, más allá de su dimensión narrativa, como el encuentro entre dos fuerzas.\nPor un lado:\nQuimera.\nLa complejidad.\nLa multiplicidad.\nLo desconocido.\nLo aparentemente contradictorio.\nEl problema que no puede reducirse fácilmente a una sola explicación.\nPor otro:\nBelerofonte.\nLa observación.\nLa estrategia.\nLa adaptación.\nLa utilización inteligente de recursos.\nLa capacidad de transformar un problema aparentemente imposible en un problema susceptible de ser resuelto.\nY entre ambos:\nPegaso.\nLa herramienta que permite ampliar las capacidades del ser humano.\nDesde esta perspectiva, el mito puede resumirse simbólicamente como:\nLa complejidad no siempre se vence mediante mayor fuerza, sino mediante una mejor comprensión del problema y una estrategia adecuada para abordarlo."
            },
            {
                title: "04. ¿POR QUÉ QUIMERA?",
                text: "El nombre del Instituto nace precisamente de esta imagen.\nQuimera representa aquello que resulta complejo, híbrido, multidimensional y difícil de comprender desde una única perspectiva.\nLas ciencias contemporáneas presentan constantemente problemas de esta naturaleza.\nLa salud, por ejemplo, no pertenece exclusivamente a una disciplina.\nUn mismo problema puede involucrar simultáneamente: biología + medicina + genética + estadística + tecnología + comunicación + lenguaje + comportamiento humano.\nIntentar comprenderlo desde una sola perspectiva puede resultar insuficiente.\nPor ello, Quimera adopta simbólicamente la criatura mitológica como representación de la complejidad interdisciplinaria.\nNo se trata de destruir la complejidad.\nSe trata de comprenderla."
            },
            {
                title: "05. ¿Y POR QUÉ BELEROFONTE?",
                text: "Si Quimera representa el problema complejo, Belerofonte representa al ser humano que decide enfrentarlo.\nNo mediante la fuerza indiscriminada, sino mediante:\n• Observación.\n• Conocimiento.\n• Estrategia.\n• Adaptación.\n• Uso de herramientas.\n• Razonamiento.\n• Decisión.\nPor ello, dentro de la identidad de Quimera, Belerofonte representa la dimensión metodológica del conocimiento.\nEl conocimiento permite reconocer el problema.\nLa metodología permite organizarlo.\nEl razonamiento permite analizarlo.\nLas herramientas permiten intervenir sobre él.\nY la evaluación permite determinar si la intervención funcionó."
            },
            {
                title: "06. PEGASO: LA HERRAMIENTA QUE AMPLÍA AL SER HUMANO.",

            },
            {
                title: "07. DE LA MITOLOGÍA A LA MISIÓN.",
                text: "La mitología detrás de Quimera no pretende convertir una historia antigua en una explicación científica.\nSu función es simbólica.\nEl mito proporciona un lenguaje para expresar una idea que permanece vigente:\nLos problemas complejos requieren comprensión, integración, estrategia y herramientas adecuadas.\nA partir de esta idea, el Instituto Quimera organiza su actividad alrededor de cuatro funciones fundamentales:\nINVESTIGACIÓN · DOCENCIA · SERVICIO · DIVULGACIÓN\nCada una representa una etapa diferente de la relación entre el conocimiento y la sociedad."
            },
            {
                title: "08. QUIMERA E INVESTIGACIÓN.",

            },
            {
                title: "09. QUIMERA Y DOCENCIA.",
                text: "La docencia representa la transferencia estructurada del conocimiento.\nEl conocimiento que no puede enseñarse corre el riesgo de permanecer aislado.\nPor ello, Quimera transforma los resultados de la investigación, la experiencia profesional y el desarrollo metodológico en:\n• Cursos.\n• Programas educativos.\n• Series pedagógicas.\n• Talleres.\n• Guías.\n• Materiales didácticos.\n• Herramientas de aprendizaje.\nLa docencia convierte el conocimiento individual o institucional en capacidad compartida."
            },
            {
                title: "10. QUIMERA Y SERVICIO.",

            },
            {
                title: "11. QUIMERA Y DIVULGACIÓN.",

            },
            {
                title: "12. EL CICLO DE QUIMERA.",
                text: "Las cuatro funciones no constituyen actividades aisladas.\nForman un ciclo el cual se deriva del <a onclick=\"openSubModal('modelo_helicoidal.png')\">Modelo Helicoidal del Desarrollo del Conocimiento</a> desarrollado por el Dr. Cerezo:\n<a onclick=\"openSubModal('ciclo_conocimiento.png')\">INVESTIGACIÓN → CONOCIMIENTO → DOCENCIA → CAPACIDAD → SERVICIO → EXPERIENCIA → DIVULGACIÓN → NUEVAS PREGUNTAS → INVESTIGACIÓN</a>\nLa investigación genera conocimiento.\nLa docencia transforma conocimiento en capacidad.\nEl servicio transforma capacidad en aplicación.\nLa divulgación transforma conocimiento especializado en comprensión compartida.\nY las preguntas que surgen de todo este proceso pueden regresar nuevamente a la investigación.\nAsí, el ciclo nunca permanece completamente cerrado."

            {
                title: "14. EL SIGNIFICADO DEL NOMBRE.",
                text: "Quimera no toma su nombre porque pretenda reproducir el monstruo de la mitología.\nLo toma porque reconoce en él una poderosa metáfora de aquello que pretende estudiar y comprender: la complejidad.\nY reconoce en Belerofonte otra metáfora igualmente importante: la capacidad humana de enfrentar la complejidad mediante conocimiento, estrategia, herramientas y decisión responsable.\nEntre ambos existe la idea que fundamenta el espíritu de Quimera: No todo problema complejo necesita una respuesta simple. Necesita una respuesta que sea capaz de comprender su complejidad sin perder la claridad necesaria para actuar.\nEse es el espíritu detrás de Quimera."
            }
        ];

        let currentStep = 0;
        const centralCard = document.getElementById('central-card');
        const cardTitle = document.getElementById('card-title');
        const mainModal = document.getElementById('main-modal');
        const modalWindow = document.getElementById('modal-window');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalCursor = document.getElementById('modal-cursor');
        let isTyping = false;

        // Función de escritura progresiva manteniendo el cursor activo en la sección actual
        const typeSection = async (element, text, speed) => {
            let i = 0;
            let isTag = false;
            let currentStr = '';
            while (i < text.length) {
                if (!isTyping) break;
                let char = text.charAt(i);
                currentStr += char;
                element.innerHTML = currentStr;
                element.appendChild(modalCursor);
                modalCursor.style.opacity = '1';

                if (char === '<') isTag = true;
                if (char === '>') isTag = false;
                if (!isTag) await new Promise(r => setTimeout(r, speed));
                i++;
            }
        };

        // Abrir Modal con transición de desenfoque y desvanecimiento
        centralCard.addEventListener('click', async () => {
            // 1. Activar desenfoque general de la pantalla
            document.body.classList.add('modal-blur-active');

            // 2. Transición de desvanecimiento del modal después del blur
            setTimeout(async () => {
                mainModal.classList.add('show');
                modalWindow.classList.remove('tv-off');
                modalTitle.innerHTML = '';
                modalBody.innerHTML = '';
                modalCloseBtn.innerHTML = '';
                modalCursor.style.opacity = '0';
                isTyping = true;

                const data = storyData[currentStep];
                
                await typeSection(modalTitle, data.title, 20);
                if (!isTyping) return;
                await typeSection(modalBody, data.text, 10);
                if (!isTyping) return;
                await typeSection(modalCloseBtn, "Cerrar.", 30);
                
                if(isTyping) {
                    modalCursor.style.opacity = '1';
                    isTyping = false;
                }
            }, 300);
        });

        // Cerrar Modal con Efecto TV y restablecer la pantalla general sin desenfoque
        const triggerTVClose = () => {
            if (modalWindow.classList.contains('tv-off')) return;
            isTyping = false; 
            modalCursor.style.opacity = '0';
            modalWindow.classList.add('tv-off');

            setTimeout(() => {
                mainModal.classList.remove('show');
                // Retirar el efecto de desenfoque al regresar a la pantalla general
                document.body.classList.remove('modal-blur-active');
                advanceStep();
            }, 600);
        };

        modalCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isTyping) triggerTVClose();
        });

        mainModal.addEventListener('click', (e) => {
            if (e.target === mainModal && !isTyping) triggerTVClose();
        });

        // Avanzar al siguiente recuadro
        const advanceStep = () => {
            centralCard.classList.remove('active');
            
            setTimeout(() => {
                currentStep++;
                if (currentStep < storyData.length) {
                    cardTitle.innerHTML = storyData[currentStep].title;
                    centralCard.classList.add('active');
                } else {
                    // Gran Final
                    centralCard.style.display = 'none';
                    triggerGrandFinale();
                }
            }, 500);
        };

        // Gran Final: Secuencia de salida (Primero desenfoque, después desvanecimiento en blanco)
        const triggerGrandFinale = () => {
            const wordQuimera = document.getElementById('word-quimera');
            wordQuimera.classList.add('finale-active');
            
            wordQuimera.addEventListener('click', () => {
                if (document.body.classList.contains('exit-phase-1')) return;

                // 1. Transición de salida: Primero desenfoque
                document.body.classList.add('exit-phase-1');

                // 2. Transición de salida: Después desvanecimiento en blanco
                setTimeout(() => {
                    document.body.classList.add('exit-phase-2');
                    
                    // 3. Redirección final
                    setTimeout(() => {
                        window.location.href = 'https://quimerac3.github.io/QuimeraC3-Q/';
                    }, 1000);
                }, 800);
            }, { once: true });
        };

        // Control de Sub-Modales (Imágenes del Paso 12)
        const subModal = document.getElementById('sub-modal');
        const subImg = document.getElementById('submodal-img');
        
        window.openSubModal = (imgSrc) => {
            subImg.src = imgSrc; 
            subModal.classList.add('show');
        };

        window.closeSubModal = () => {
            subModal.classList.remove('show');
        };

        subModal.addEventListener('click', (e) => {
            if(e.target === subModal) closeSubModal();
        });

        /* Controles de Música y Pantalla Completa */
        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;">🎵</span> Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    audioToggle.innerHTML = '<span style="color: #ffffff;">🎶</span> Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenToggle.textContent = '⛶ Pantalla Completa';
            } else {
                fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
            }
        });

        // Animación de entrada inicial de página desde negro absoluto (sin blanco) y elementos secuenciales
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');
            
            // Revelar el fondo y desvanecer la capa negra inicial
            setTimeout(() => {
                document.getElementById('bg-layer').style.opacity = '1';
                overlay.style.opacity = '0';
            }, 600);

            setTimeout(() => { document.querySelector('.top-bar').style.opacity = '1'; }, 1600);
            
            setTimeout(() => {
                const brandLogo = document.querySelector('.brand-logo');
                const text = brandLogo.dataset.text;
                let i = 0;
                function typeBrandLogo() {
                    if (i <= text.length) {
                        brandLogo.innerHTML = text.substring(0, i);
                        i++;
                        setTimeout(typeBrandLogo, 25);
                    }
                }
                typeBrandLogo();
            }, 2100);

            setTimeout(() => { document.querySelector('header').style.opacity = '1'; }, 2900);
            setTimeout(async () => {
                const subP = document.querySelector('header p');
                await typeSection(subP, subP.dataset.text, 15);
            }, 3500);
            
            setTimeout(() => { document.querySelector('footer').style.opacity = '1'; }, 4700);
            
            setTimeout(() => {
                const footerPs = document.querySelectorAll('footer p');
                let pIndex = 0;
                function typeFooterP() {
                    if (pIndex >= footerPs.length) return;
                    let p = footerPs[pIndex];
                    let text = p.dataset.text.replace('2026', new Date().getFullYear());
                    let i = 0;
                    function typeChar() {
                        if (i <= text.length) {
                            p.innerHTML = text.substring(0, i);
                            i++;
                            setTimeout(typeChar, 18);
                        } else {
                            pIndex++;
                            setTimeout(typeFooterP, 100);
                        }
                    }
                    typeChar();
                }
                typeFooterP();
            }, 5100);
        });
    </script>
</body>
</html>
