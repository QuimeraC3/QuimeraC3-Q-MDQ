    <style>
        :root {
            --text-main: #0f172a;
            --primary: #0f766e;
            --accent: #c88b32; /* Cobre Dorado */
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        /* CAPA CRT SCANLINES (Efecto de televisión antigua global) */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.65;
        }

        /* EFECTO CRT UNIFICADO (Opción B: Pantalla TV CRT fija con capa estática sobre el scroll) */
        .crt-screen-effect {
            position: relative;
            overflow: hidden; /* La ventana contenedora no hace scroll, solo el wrapper interno */
            border-radius: 16px;
            box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 25px 35px -10px rgba(0, 0, 0, 0.6);
        }

        .crt-screen-effect::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.85;
            border-radius: inherit;
        }

        .crt-screen-effect::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 21;
            background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
            border-radius: inherit;
        }

        /* CONTENEDOR INTERNO DE DESPLAZAMIENTO (Scroll suave por detrás del marco CRT) */
        .modal-scroll-wrapper {
            position: relative;
            z-index: 10;
            max-height: 85vh;
            overflow-y: auto;
            padding: clamp(1.5rem, 5vw, 3rem);
        }

        /* Capa de fondo estática, nítida y completa */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.0), rgba(15, 23, 42, 0.0)), url('Quimera_MDQ.webp');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            opacity: 0;
            transition: opacity 1000ms ease, filter 0.5s ease;
        }

        /* Desenfoque exclusivo del fondo e interfaz posterior sin tocar la capa de glitch */
        .blurring-content header,
        .blurring-content .top-bar,
        .blurring-content main,
        .blurring-content footer,
        .blurring-content #bg-layer {
            filter: blur(12px);
            transition: filter 0.5s ease;
        }

        /* Capa de luz reactiva exclusiva del puntero */
        .cursor-light-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.22), rgba(200, 139, 50, 0.12) 45%, transparent 80%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .cursor-light-glow.visible {
            opacity: 1;
        }

        /* Canvas para Lluvia de Código Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* Capa de Glitch Central: Se mantiene nítida sin backdrop-filter */
        #glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            pointer-events: none;
            opacity: 0;
            background: rgba(0, 0, 0, 0.5);
            transition: opacity 0.1s ease;
        }

        #glitch-img {
            max-width: 55vw;
            max-height: 55vh;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(56, 189, 248, 1)) contrast(160%) brightness(1.3);
            animation: glitchJitter 0.08s infinite steps(2);
        }

        @keyframes glitchJitter {
            0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg); }
            20% { transform: translate(-6px, 4px) skew(-3deg); filter: hue-rotate(90deg); }
            40% { transform: translate(6px, -4px) skew(3deg); filter: hue-rotate(-90deg); }
            60% { transform: translate(-3px, -4px) skew(1deg); }
            80% { transform: translate(5px, 3px) skew(-2deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        .fade-out-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 1.2s ease !important;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease, background-color 1.2s ease;
        }

        /* NAVEGACIÓN TOP BAR */
        .top-bar {
            background-color: rgba(11, 19, 41, 0.0);
            padding: 0.85rem 2rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            opacity: 0;
            transition: opacity 500ms ease, filter 0.5s ease;
        }

        .top-bar-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease, opacity 500ms ease;
        }

        .brand-logo:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            gap: clamp(0.5rem, 2vw, 1.25rem);
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;

            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {

        }

        #audio-toggle, #fullscreen-toggle {
            display: inline-block;
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #ffffff;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
            transition: opacity 500ms ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #audio-toggle:hover, #fullscreen-toggle:hover {
            background: rgba(56, 189, 248, 0.5);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        /* EFECTO LÁSER COMÚN (ACELERADO A 0.6s) */
        .laser-burn-effect {
            opacity: 0;
            clip-path: inset(0 100% 0 0);
            position: relative;
        }

        .laser-burn-effect.active-laser {
            opacity: 1;
            animation: hyperLaserReveal 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
        }

        .laser-burn-effect.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
        }

        .laser-burn-effect.active-laser::before {
            content: '';
            position: absolute;
            top: -30px;
            bottom: -30px;
            left: 0;
            width: 16px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #c88b32 80%, transparent 100%);
            box-shadow: 0 0 35px #38bdf8, 0 0 70px #fffbeb, 0 0 100px #c88b32, inset 0 0 15px #ffffff;
            animation: hyperLaserBarMove 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 15;
            filter: blur(0.5px);
        }

        .laser-burn-effect.active-laser::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 120%;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(56,189,248,0.6) 30%, rgba(200,139,50,0.3) 60%, transparent 100%);
            mix-blend-mode: color-dodge;
            animation: hyperLaserSparksWave 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 12;
        }

        @keyframes hyperLaserReveal {
            0% {
                clip-path: inset(0 100% 0 0);
                filter: brightness(4) contrast(200%) drop-shadow(0 0 30px rgba(56, 189, 248, 1));
            }
            50% {
                filter: brightness(2.5) contrast(150%) drop-shadow(0 0 15px rgba(200, 139, 50, 0.9));
            }
            100% {
                clip-path: inset(0 0 0 0);
                filter: brightness(1) contrast(100%) drop-shadow(0 0 0px transparent);
            }
        }

        @keyframes hyperLaserBarMove {
            0% { left: 0%; opacity: 1; transform: scaleY(1.8) skewX(-15deg); }
            50% { transform: scaleY(2.2) skewX(5deg); }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; transform: scaleY(0.5) skewX(0deg); }
        }

        @keyframes hyperLaserSparksWave {
            0% { opacity: 1; clip-path: inset(0 100% 0 0); }
            100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        .hologram-mode {
            animation: hologramNeonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hologramNeonGlow {
            0% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            50% { text-shadow: 0 0 20px rgba(56, 189, 248, 1), 0 0 35px rgba(56, 189, 248, 0.8), 0 0 50px rgba(200, 139, 50, 0.6), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            100% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
        }

        @keyframes hologramBoxGlow {
            0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(15, 118, 110, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 32px rgba(56, 189, 248, 0.95), 0 0 65px rgba(56, 189, 248, 0.65), 0 0 85px rgba(200, 139, 50, 0.55), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
            100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(15, 118, 110, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        }

        /* HEADER ESTRUCTURAL OPTIMIZADO PARA ASCENSO LIBRE Y PROTECCIÓN DE TILDES */
        header {
            font-family: Georgia, serif;
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: .02rem 2rem 1rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: filter 0.5s ease;
        }

        #header-line1-container {
            position: relative;
            z-index: 20;
            width: 100%;
        }

        #header-line1 {
            color: #e2a547;
            display: inline-block;
            font-size: clamp(1.5rem, 3.5vw, 4rem); 
            line-height: 1.3;
            -webkit-text-stroke: 1.5px #ffffff;
            transform: translateY(-.08rem);
            position: relative;
            z-index: 20;
            padding-top: 0.2em;
        }

        .arrow-02-text {
            margin-top: 11.5rem;
            margin-bottom: 1rem;
        }

        #word-quimera {
            display: inline-block;
            font-size: clamp(2.5rem, 10vw, 6rem);
            letter-spacing: -0.05em;
            line-height: 1.3;
            -webkit-text-stroke: 1.5px #000000;
            color: #ffffff;
            padding-right: 0.15em;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        /* TARJETA CENTRAL CON EFECTO DE LUZ RGB POSTERIOR (Hologram Box Glow) */
        main {
            flex: 1;
            display: flex;
            align-items: flex-end; 
            justify-content: center;
            padding: 2rem 2rem 08vh 2rem; 
            z-index: 10;
            position: relative;
            transition: filter 0.5s ease;
        }

        .seq-card {
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(1px);
            border: 1.5px solid #ffffff;
            border-radius: 12px;
            padding: clamp(1.5rem, 4vw, 2rem) clamp(1.5rem, 5vw, 3rem);
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.5s ease;
            display: none;
            max-width: 600px;
            width: 100%;
            transform: translateY(20px);
        }

        .seq-card h2 {
            font-family: Georgia, serif;
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            color: #ffffff;
            text-transform: uppercase;
            min-height: 2.2rem;
            -webkit-text-stroke: 0.25px #c88b32;
        }

        .seq-card:hover { transform: translateY(20px) scale(1.05); }

        .tv-on-card { 
            animation: tvTurnOnCard 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards, hologramBoxGlow 3s ease-in-out infinite alternate; 
            animation-delay: 0s, 0.6s;
        }
        
        .tv-off-card { animation: tvTurnOffCard 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes tvTurnOnCard {
            0% { transform: translateY(20px) scale(0, 0); opacity: 0; filter: brightness(10); }
            40% { transform: translateY(20px) scale(0.001, 0.005); opacity: 1; filter: brightness(5); }
            70% { transform: translateY(20px) scale(1, 0.005); opacity: 1; filter: brightness(2); }
            100% { transform: translateY(20px) scale(1, 1); opacity: 1; filter: brightness(1); }
        }

        @keyframes tvTurnOffCard {
            0% { transform: translateY(20px) scale(1, 1); opacity: 1; filter: brightness(1); }
            40% { transform: translateY(20px) scale(1, 0.005); opacity: 1; filter: brightness(2); }
            70% { transform: translateY(20px) scale(0.001, 0.005); opacity: 1; filter: brightness(5); }
            100% { transform: translateY(20px) scale(0, 0); opacity: 0; filter: brightness(10); }
        }

        /* MODALES Y SUBMODALES CON TEXTURA DE RESPALDO Mod_00.webp Y FONDO DINÁMICO DE MODAL */
        .modal-overlay, .submodal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
        }

        .submodal-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 3000;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.show, .submodal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window, .submodal-text-window {
            background-size: cover;
            background-position: center center;
            padding: 0; /* Padding movido a .modal-scroll-wrapper para scroll perfecto detrás de las scanlines */
            border-radius: 16px;
            max-width: 750px;
            width: 90%;
            max-height: 85vh;
            position: relative;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--card-border);
            transform-origin: center center;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .modal-window {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), var(--modal-bg-img, url('Mod_00.webp'));
        }

        .submodal-text-window {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('Mod_00.webp');
            background-size: cover;
            background-position: center center;
            display: none;
        }

        .tv-on { animation: tvTurnOn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, hologramBoxGlow 3s ease-in-out infinite alternate !important; animation-delay: 0s, 0.4s; }
        .tv-off { animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important; }

        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        @keyframes tvTurnOn {
            0% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
            30% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            60% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }

        function startMatrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZカタカナアアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 16;
            let columns = Math.floor(canvas.width / fontSize);
            let drops = Array(columns).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));

                    if (Math.random() > 0.88) {
                        ctx.fillStyle = '#fffbeb';
                    } else {
                        ctx.fillStyle = '#c88b32';
                    }

                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(draw, 33);
        }

            startMatrixRain();
            const canvas = document.getElementById('matrix-canvas');
            if (canvas) canvas.style.opacity = '1';
        }

        let globalColorInterval = null;

        // Implementación del efecto de blanco a dorado (cobre) hasta que sea seleccionada
        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('word-quimera-container');
            const letters = document.querySelectorAll('.quimera-letter');
            
            wordContainer.classList.remove('hologram-mode');
            wordContainer.style.opacity = '1';
            wordContainer.style.pointerEvents = 'auto';
            wordContainer.style.cursor = 'pointer';

            const stepTime = 120; // Velocidad de transición entre cada letra

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) {
                        letters[i].style.color = '#c88b32';
                        i++;
                        globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime);
                    } else if (callback) callback();
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) callback();
                }

                turnCopperGold(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);
                document.body.classList.add('blurring-content');

                const overlay = document.getElementById('intro-overlay');
                overlay.style.backgroundColor = '#ffffff';
                overlay.style.opacity = '1';

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 1000);
            };
        }

        async function updateCardTitleLaser(text) {
            cardTitleContainer.classList.remove('revealed');
            cardTitleContainer.classList.add('active-laser');
            cardTitleText.textContent = text;
            
            await new Promise(r => setTimeout(r, 600));
            cardTitleContainer.classList.remove('active-laser');
            cardTitleContainer.classList.add('revealed');
        }

        // FUNCIÓN AUXILIAR DE ANIMACIÓN ESCALONADA CON SOLAPAMIENTO RESPETANDO CONTENEDORES
        async function animateModalContent(titleElem, bodyElem, closeElem, titleText, contentData) {
            titleElem.textContent = titleText;
            bodyElem.innerHTML = '';
            closeElem.className = 'laser-burn-effect';
            closeElem.textContent = 'Cerrar.';

            const elementsToAnimate = [titleElem];

            for (let block of contentData) {
                const blockElem = document.createElement(block.type === 'flow' ? 'div' : 'p');
                if (block.type === 'flow') {
                    blockElem.className = 'process-flow laser-burn-effect';
                } else {
                    blockElem.className = 'laser-burn-effect';
                    blockElem.style.marginBottom = '1rem';
                }
                blockElem.innerHTML = block.text;
                bodyElem.appendChild(blockElem);
                elementsToAnimate.push(blockElem);
            }

            elementsToAnimate.push(closeElem);

            await new Promise(r => setTimeout(r, 100));

            for (let el of elementsToAnimate) {
                el.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 250));
            }

            await new Promise(r => setTimeout(r, 600));

            for (let el of elementsToAnimate) {
                el.classList.remove('active-laser');
                el.classList.add('revealed');
            }
            closeElem.className = 'modal-close-btn revealed';
        }

        function triggerCardGlitch(callback) {
            const glitchOverlay = document.getElementById('glitch-overlay');
            const glitchImg = document.getElementById('glitch-img');

            const randomGlitch = glitchImages[currentStep % glitchImages.length];
            glitchImg.src = ''; 
            glitchOverlay.style.opacity = '1';

            setTimeout(() => {
                glitchImg.src = randomGlitch;
            }, 30);

            setTimeout(() => {
                glitchOverlay.style.opacity = '0';
                setTimeout(() => {
                    if (callback) callback();
                }, 100); 
            }, 750);
        }

        centralCard.addEventListener('click', async () => {
            if (isCardBusy || isModalBusy) return;

            // SI ES EL ÚLTIMO PASO: Programamos el retraso de 2 segundos para activar la lluvia de Matrix
            if (currentStep === storyData.length - 1) {
                setTimeout(() => {
                    triggerMatrixAndFadeElements();
                }, 2000);
            }

            // Aplicamos desenfoque únicamente a los elementos de fondo
            document.body.classList.add('blurring-content');

            triggerCardGlitch(async () => {
                const data = storyData[currentStep];

                // Asignación de imagen de fondo específica para el modal
                modalWindow.style.setProperty('--modal-bg-img', `url('${data.bgImage}')`);

                document.body.classList.remove('blurring-content');
                mainModal.classList.add('show');
                modalWindow.classList.remove('tv-off');
                modalWindow.classList.add('tv-on');
                
                isModalBusy = true;

                modalBody.style.textAlign = data.align || 'left';
                
                await animateModalContent(modalTitle, modalBody, modalCloseBtn, data.title, data.content);
                
                isModalBusy = false;
            });
        });

        const triggerTVClose = () => {
            if (modalWindow.classList.contains('tv-off') || isModalBusy) return;
            
            modalWindow.classList.remove('tv-on');
            modalWindow.classList.add('tv-off');

            setTimeout(async () => {
                mainModal.classList.remove('show');
                modalWindow.classList.remove('tv-off');
                
                modalTitle.textContent = '';
                modalBody.innerHTML = '';
                modalCloseBtn.className = 'laser-burn-effect';

                isCardBusy = true;
                
                if (currentStep < storyData.length - 1) {
                    currentStep++;
                    await updateCardTitleLaser(storyData[currentStep].title);
                    isCardBusy = false; 
                } else {
                    centralCard.classList.add('tv-off-card');
                    setTimeout(() => {
                        centralCard.style.display = 'none';
                        enableFinalHyperlink();
                    }, 500); 
                }
            }, 400);
        };

        modalCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isModalBusy) triggerTVClose();
        });

        mainModal.addEventListener('click', (e) => {
            if (e.target === mainModal && !isModalBusy) triggerTVClose();
        });

        /* --- CONTROL DE SUBMODALES Y SECUENCIA HELICOIDAL --- */
        const subModal = document.getElementById('sub-modal');
        const subImg = document.getElementById('submodal-img');
        const subModalTextWindow = document.getElementById('submodal-text-window');
        const subModalXBtn = document.getElementById('submodal-x-btn');
        const subModalTitle = document.getElementById('sub-modal-title');
        const subModalBody = document.getElementById('sub-modal-body');
        const subModalCloseBtn = document.getElementById('sub-modal-close-btn');

        let isSubModalBusy = false;
        let helicoidalSequenceRunning = false;

        window.openSubModal = (imgSrc) => {
            helicoidalSequenceRunning = false;
            subModalTextWindow.style.display = 'none';
            subImg.style.display = 'block';
            subModalXBtn.style.display = 'block';
            
            subImg.classList.remove('tv-off', 'tv-on');
            subImg.style.opacity = '';
            subImg.src = imgSrc;
            subModal.classList.add('show');
            
            if (imgSrc === 'ECQ.webp') {
                subImg.classList.add('tv-on');
            } else {
                subImg.style.opacity = '0';
                const triggerFadeIn = () => { setTimeout(() => { subImg.style.opacity = '1'; }, 50); };
                if (subImg.complete) triggerFadeIn(); else subImg.onload = triggerFadeIn;
            }
        };

        window.startHelicoidalSequence = async () => {
            helicoidalSequenceRunning = true;
            subModalTextWindow.style.display = 'none';
            subImg.style.display = 'block';
            subModalXBtn.style.display = 'block';
            subImg.classList.remove('tv-off', 'tv-on');
            subModal.classList.add('show');

            const images = ['01-borrador_T-P.webp', '02-Teoria-Preg.webp', '03-HECE.webp', '04-MHDC.webp'];

            for (let i = 0; i < images.length; i++) {
                if (!helicoidalSequenceRunning) return;
                subImg.style.opacity = '0';
                await new Promise(r => setTimeout(r, 600));
                
                if (!helicoidalSequenceRunning) return;
                subImg.src = images[i];
                
                await new Promise(resolve => {
                    if (subImg.complete) resolve();
                    else subImg.onload = resolve;
                });
                
                if (!helicoidalSequenceRunning) return;
                subImg.style.opacity = '1';
                await new Promise(r => setTimeout(r, 2000));

                if (!helicoidalSequenceRunning) return;
                if (i === images.length - 1) {
                    subImg.style.opacity = '0';
                    await new Promise(r => setTimeout(r, 600));
                    if (!helicoidalSequenceRunning) return;
                    showHelicoidalTextWindow();
                    return;
                }
            }
        };

        const showHelicoidalTextWindow = async () => {
            subImg.style.display = 'none';
            subModalXBtn.style.display = 'none';
            subModalTextWindow.style.display = 'block';
            subModalTextWindow.classList.remove('tv-off');
            subModalTextWindow.classList.add('tv-on');

            isSubModalBusy = true;

            const paragraphs = [
                "Representa el conocimiento como un proceso continuo de transformación. Una teoría o comprensión previa permite interpretar la realidad, pero al enfrentarse con nuevos fenómenos surgen problemas, contradicciones o interrogantes que cuestionan sus límites.",
                "El análisis permite investigar y construir respuestas; la revisión somete esas respuestas a criterios de rigor, coherencia y evidencia; y la transferencia incorpora el nuevo conocimiento a la comprensión existente.",
                "Sin embargo, el proceso no termina con la solución. Cada problema resuelto genera nuevas preguntas, y las nuevas preguntas permiten acceder a problemas de mayor complejidad.",
                "Por ello, el conocimiento no se desarrolla en círculos que regresan al mismo punto, sino mediante una hélice ascendente: cada ciclo conserva, transforma y amplía lo aprendido, conduciendo hacia niveles progresivamente más profundos de comprensión.",
                "Resolver un problema no es el final del conocimiento; es el comienzo de una pregunta mejor."
            ];

            const formattedContent = paragraphs.map(text => ({ type: 'p', text: text }));
            
            await animateModalContent(subModalTitle, subModalBody, subModalCloseBtn, "MODELO HELICOIDAL DEL DESARROLLO DEL CONOCIMIENTO.", formattedContent);

            isSubModalBusy = false;
        };

        const triggerHelicoidalTextClose = () => {
            if (subModalTextWindow.classList.contains('tv-off') || isSubModalBusy) return;
            subModalTextWindow.classList.remove('tv-on');
            subModalTextWindow.classList.add('tv-off');

            setTimeout(() => {
                subModalTextWindow.style.display = 'none';
                subModalTextWindow.classList.remove('tv-off');
                
                subModalTitle.textContent = '';
                subModalBody.innerHTML = '';
                subModalCloseBtn.className = 'laser-burn-effect';

                subImg.style.opacity = '0';
                subImg.src = '04-MHDC.webp';
                subImg.style.display = 'block';
                subModalXBtn.style.display = 'block';
                
                setTimeout(() => { subImg.style.opacity = '1'; }, 50);
            }, 500);
        };

        subModalCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isSubModalBusy) triggerHelicoidalTextClose();
        });

        window.closeSubModal = () => {
            helicoidalSequenceRunning = false;
            isSubModalBusy = false;
            
            if (subImg.src.includes('ECQ.webp') && subImg.classList.contains('tv-on')) {
                subImg.classList.remove('tv-on');
                subImg.classList.add('tv-off');
                setTimeout(() => {
                    subImg.classList.remove('tv-off');
                    subImg.style.opacity = '0';
                    subModal.classList.remove('show');
                }, 400);
            } else {
                subImg.style.opacity = '0';
                subModal.classList.remove('show');
            }
            
            setTimeout(() => {
                subModalTextWindow.style.display = 'none';
                subModalTextWindow.classList.remove('tv-off', 'tv-on');
            }, 500);
        };

        subModal.addEventListener('click', (e) => {
            if (e.target === subModal) {
                if (subModalTextWindow.style.display === 'block') {
                    if (!isSubModalBusy) triggerHelicoidalTextClose();
                } else {
                    closeSubModal();
                }
            }
        });

        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;">🎵</span> Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    audioToggle.innerHTML = '<span style="color: #ffffff;">🎶</span> Música: ON';
                    isMusicPlaying = true;
                }).catch(error => console.log("Error de audio:", error));
            }
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => console.log("Error Fullscreen:", err));
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenToggle.textContent = !document.fullscreenElement ? '⛶ Pantalla Completa' : '❌ Salir Pantalla Completa';
        });

        // SECUENCIA DE ENTRADA GENERAL
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');

            async function runEntranceSequence() {
                overlay.style.backgroundColor = '#ffffff';
                overlay.style.opacity = '1';
                await new Promise(r => setTimeout(r, 150));

                overlay.style.backgroundColor = '#000000';
                await new Promise(r => setTimeout(r, 600));

                document.getElementById('bg-layer').style.opacity = '1';
                document.getElementById('cursor-light-glow').classList.add('visible');
                
                overlay.style.opacity = '0';
                await new Promise(r => setTimeout(r, 500));

                document.querySelector('.top-bar').style.opacity = '1';
                await new Promise(r => setTimeout(r, 200));

                const brandLogo = document.querySelector('.brand-logo');
                brandLogo.textContent = brandLogo.dataset.text;
                brandLogo.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                brandLogo.classList.remove('active-laser');
                brandLogo.classList.add('revealed', 'hologram-mode');

                const audioToggleBtn = document.getElementById('audio-toggle');
                audioToggleBtn.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                audioToggleBtn.classList.remove('active-laser');
                audioToggleBtn.classList.add('revealed', 'hologram-mode');

                const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
                fullscreenToggleBtn.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                fullscreenToggleBtn.classList.remove('active-laser');
                fullscreenToggleBtn.classList.add('revealed', 'hologram-mode');

                const line1Container = document.getElementById('header-line1-container');
                line1Container.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                line1Container.classList.remove('active-laser');
                line1Container.classList.add('revealed', 'hologram-mode');

                const wordQuimeraContainer = document.getElementById('word-quimera-container');
                wordQuimeraContainer.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                wordQuimeraContainer.classList.remove('active-laser');
                wordQuimeraContainer.classList.add('revealed', 'hologram-mode');

                centralCard.style.display = 'block';
                cardTitleText.textContent = ''; 
                centralCard.classList.add('tv-on-card');
                await new Promise(r => setTimeout(r, 400));

                await updateCardTitleLaser(storyData[0].title);
                isCardBusy = false;

                const mainFooter = document.getElementById('main-footer');
                const footerText = document.getElementById('footer-text');
                footerText.textContent = footerText.dataset.text.replace('2026', new Date().getFullYear());
                mainFooter.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 600));
                mainFooter.classList.remove('active-laser');
                mainFooter.classList.add('revealed', 'hologram-mode');
            }

            runEntranceSequence();

            document.brandLogoLink = document.querySelector('.brand-logo');
            if (document.brandLogoLink) {
                document.brandLogoLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const overlay = document.getElementById('intro-overlay');
                    overlay.style.backgroundColor = '#ffffff';
                    overlay.style.opacity = '1';
                    
                    setTimeout(() => {
                        window.location.href = "https://quimerac3.github.io/";
                    }, 1000);
                });
            }
        });
    </script>
</body>
