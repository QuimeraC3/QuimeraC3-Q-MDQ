        /* ─────────────── CANDADO GIGANTE (PORTAL) ─────────────── */

        /* ─────────────── APERTURA PROGRESIVA — CANDADO GIGANTE ─────────────── */

    <script>
        'use strict';

        window.addEventListener('pageshow', (event) => { if (event.persisted) window.location.reload(); });

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const forceFullMotion = new URLSearchParams(location.search).has('fullmotion');
        if (forceFullMotion) document.documentElement.classList.add('force-full-motion');
        const useReducedMotion = () => !forceFullMotion && prefersReducedMotion.matches;

        function announce(message) {
            const announcer = document.getElementById('a11y-announcer');
            if (!announcer) return;
            announcer.textContent = '';
            setTimeout(() => { announcer.textContent = message; }, 50);
        }

        const calTimeouts = new Set();
        function calTimeout(fn, ms) {
            const id = setTimeout(() => {
                calTimeouts.delete(id);
                try { fn(); } catch (err) { console.error('[Quimera] calTimeout error:', err); }
            }, ms);
            calTimeouts.add(id);
            return id;
        }
        function clearCalTimeouts() {
            calTimeouts.forEach((id) => clearTimeout(id));
            calTimeouts.clear();
        }

        let lastFocusedBeforeModal = null;
        function saveFocus() { lastFocusedBeforeModal = document.activeElement; }
        function restoreFocus() {
            if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === 'function') {
                lastFocusedBeforeModal.focus();
            }
            lastFocusedBeforeModal = null;
        }

        const FOCUSABLE_SELECTOR = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            let activeContainer = null;
            if (subModal.classList.contains('show')) activeContainer = subModal;
            else if (calibrationModal.classList.contains('show')) activeContainer = calibrationModal;
            else if (mainModal.classList.contains('show')) activeContainer = mainModal;
            if (!activeContainer) return;
            const focusables = Array.from(activeContainer.querySelectorAll(FOCUSABLE_SELECTOR)).filter(el => !el.disabled && el.offsetParent !== null);
            if (focusables.length === 0) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (!activeContainer.contains(document.activeElement)) {
                e.preventDefault();
                first.focus();

                if (waveStartTime > 0) {
                    const wElapsed = now - waveStartTime;
                    if (wElapsed < WAVE_DURATION) {
                        const wT = wElapsed / WAVE_DURATION;
                        const waveX = -180 + (canvas.width + 360) * wT;
                        const grad = ctx.createLinearGradient(waveX - 140, 0, waveX + 140, 0);
                        grad.addColorStop(0.0, 'rgba(56, 189, 248, 0)'); grad.addColorStop(0.35, 'rgba(56, 189, 248, 0.65)'); grad.addColorStop(0.5, 'rgba(255, 255, 255, 1)'); grad.addColorStop(0.65, 'rgba(56, 189, 248, 0.65)'); grad.addColorStop(1.0, 'rgba(56, 189, 248, 0)');
                        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = grad;
                        ctx.fillRect(waveX - 140, phraseY - fontSize * 1.3, 280, fontSize * 2.6);
                        ctx.restore();
                    }
                }
                if (allArrived) {
                    const pulse = 0.55 + 0.45 * Math.sin(now * 0.0028);
                    ctx.save(); ctx.globalCompositeOperation = 'lighter';
                    ctx.font = `900 ${fontSize}px 'Courier New', monospace`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = `rgba(56, 189, 248, ${0.055 * pulse})`;
                    ctx.shadowBlur = 32 * pulse; ctx.shadowColor = '#38bdf8';
                    ctx.fillText(phrase, canvas.width / 2, phraseY);
                    ctx.restore(); ctx.shadowBlur = 0;
                }
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('word-quimera-container');
            const letters = document.querySelectorAll('.quimera-letter');
            wordContainer.classList.remove('hologram-mode');
            wordContainer.style.opacity = '1';

            wordContainer.style.cursor = 'pointer';
            wordContainer.setAttribute('role', 'link');
            wordContainer.setAttribute('tabindex', '0');
            wordContainer.setAttribute('aria-label', 'Ir al portal principal del Ecosistema Quimera');

            const stepTime = useReducedMotion() ? 400 : 120;

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) { letters[i].style.color = '#c88b32'; i++; globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime); }
                    else if (callback) callback();
                }
                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) { letters[j].style.color = '#ffffff'; j++; globalColorInterval = setTimeout(() => turnWhite(callback), stepTime); }
                    else if (callback) callback();
                }
                turnCopperGold(() => { i = 0; turnWhite(() => { j = 0; globalColorInterval = setTimeout(runSequence, 0); }); });
            }
            runSequence();

            const goToPortal = () => {
                clearTimeout(globalColorInterval);
                document.body.classList.add('blurring-content');
                const overlay = document.getElementById('intro-overlay');
                overlay.style.backgroundColor = '#ffffff';
                overlay.style.opacity = '1';
                setTimeout(() => { window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/"; }, 1000);
            };
            wordContainer.addEventListener('click', goToPortal, { once: true });
            wordContainer.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToPortal(); }

        function initCalibrationPuzzle() {
            clearCalTimeouts();
            if (pendingPuzzleRebuild) { clearTimeout(pendingPuzzleRebuild); pendingPuzzleRebuild = null; }
            const scrollWrapper = document.getElementById('cal-scroll-wrapper');
            scrollWrapper.classList.remove('q-portal-vaporize');

        function placeConceptInSlot(concept, slotIdx) {
            if (!concept || calPlaced[slotIdx] !== null) return;
            for (let i = 0; i < 4; i++) { if (calPlaced[i] === concept) calPlaced[i] = null; }
            calPlaced[slotIdx] = concept;
            calUsed[concept] = true;
            selectedSourceConcept = null;
            const line = calLinesData[slotIdx];
            const lockElem = document.getElementById(`cal-lock-${slotIdx}`);

            if (concept === line.correct) {
                // ✨ Apertura progresiva del candado (5 etapas, ~0.9s)
                lockElem.classList.add('unlocked');
                lockElem.classList.remove('error');

                // Actualización visual inmediata de la ranura y de las cajas de concepto
                const slot = lockElem.parentElement.querySelector('.cal-target-slot');
                if (slot) {
                    slot.textContent = `[ ${concept} ]`;
                    slot.classList.add('filled');
                    slot.setAttribute('aria-label', `Ranura con ${concept}. Pulsa para liberar.`);
                }
                document.querySelectorAll('#cal-source-single-row .cal-concept-box').forEach((box) => {
                    const boxConcept = box.textContent.replace(/[\[\]\s]/g, '');
                    if (boxConcept === concept) {
                        box.classList.add('used');
                        box.setAttribute('tabindex', '-1');
                        box.setAttribute('aria-disabled', 'true');
                        box.draggable = false;
                    }
                });

                // Reconstrucción diferida: da tiempo a la animación de apertura
                if (pendingPuzzleRebuild) { clearTimeout(pendingPuzzleRebuild); pendingPuzzleRebuild = null; }
                const delay = useReducedMotion() ? 60 : 950;
                pendingPuzzleRebuild = setTimeout(() => {
                    pendingPuzzleRebuild = null;
                    try { renderCalibrationPuzzle(); } catch (err) { console.error(err); }
                }, delay);

                checkCalibrationComplete();
                return;
            }

            // Concepto incorrecto — shake + limpieza tras 600ms
            lockElem.classList.add('error');
            document.getElementById('cal-status-msg').textContent = "¡Concepto incorrecto! Intenta de nuevo.";
            const capturedConcept = concept;
            const capturedSlot = slotIdx;
            calTimeout(() => {
                lockElem.classList.remove('error');
                if (calPlaced[capturedSlot] === capturedConcept) {
                    calPlaced[capturedSlot] = null;
                    calUsed[capturedConcept] = false;
                }
                document.getElementById('cal-status-msg').textContent = "";
                renderCalibrationPuzzle();
            }, 600);
        }

        function renderCalibrationPuzzle() {
            const container = document.getElementById('cal-source-single-row'); if (!container) return;
            container.innerHTML = '';
            availableConcepts.forEach(c => {
                const box = document.createElement('div');
                box.className = 'cal-concept-box' + (calUsed[c] ? ' used' : '') + (selectedSourceConcept === c ? ' selected' : '');
                box.textContent = `[ ${c} ]`;
                box.setAttribute('role', 'button');
                box.setAttribute('tabindex', calUsed[c] ? '-1' : '0');
                box.setAttribute('aria-label', `Seleccionar concepto ${c}`);
                box.setAttribute('aria-disabled', calUsed[c] ? 'true' : 'false');
                if (!calUsed[c]) box.draggable = true;
                box.addEventListener('dragstart', (e) => { if (!calUsed[c]) e.dataTransfer.setData('text/plain', c); });
                const activate = () => { if (!calUsed[c]) { selectedSourceConcept = (selectedSourceConcept === c) ? null : c; renderCalibrationPuzzle(); } };
                box.addEventListener('click', activate);
                box.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !calUsed[c]) { e.preventDefault(); activate(); } });
                container.appendChild(box);
            });
            const linesContainer = document.getElementById('cal-target-lines'); if (!linesContainer) return;
            linesContainer.innerHTML = '';
            calLinesData.forEach((line, idx) => {
                const row = document.createElement('div');
                row.className = 'cal-row';
                const slot = document.createElement('div');
                slot.className = 'cal-target-slot' + (calPlaced[idx] ? ' filled' : '');
                slot.textContent = calPlaced[idx] ? `[ ${calPlaced[idx]} ]` : '[ ? ]';
                slot.setAttribute('role', 'button');
                slot.setAttribute('tabindex', '0');
                slot.setAttribute('aria-label', calPlaced[idx] ? `Ranura con ${calPlaced[idx]}. Pulsa para liberar.` : 'Ranura vacía. Pulsa para colocar el concepto seleccionado.');
                slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('drag-over'); });
                slot.addEventListener('dragleave', () => { slot.classList.remove('drag-over'); });
                slot.addEventListener('drop', (e) => { e.preventDefault(); slot.classList.remove('drag-over'); const dc = e.dataTransfer.getData('text/plain'); if (dc) placeConceptInSlot(dc, idx); });
                const activateSlot = () => {
                    if (calPlaced[idx]) {
                        const returned = calPlaced[idx]; calUsed[returned] = false; calPlaced[idx] = null;
                        const lockElem = document.getElementById(`cal-lock-${idx}`);
                        lockElem.classList.remove('unlocked', 'error');
                        document.getElementById('cal-status-msg').textContent = "";
                        renderCalibrationPuzzle();
                    } else if (selectedSourceConcept) placeConceptInSlot(selectedSourceConcept, idx);
                };
                slot.addEventListener('click', activateSlot);
                slot.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateSlot(); } });
                row.appendChild(slot);
                const lockContainer = document.createElement('div');
                lockContainer.id = `cal-lock-${idx}`;
                lockContainer.className = 'holo-lock' + (calPlaced[idx] === line.correct ? ' unlocked' : '');
                lockContainer.setAttribute('aria-hidden', 'true');
                lockContainer.innerHTML = '<div class="holo-shackle"></div><div class="holo-body"></div>';
                row.appendChild(lockContainer);
                const textSpan = document.createElement('div');
                textSpan.className = 'cal-line-text';
                textSpan.textContent = line.text;
                row.appendChild(textSpan);
                linesContainer.appendChild(row);
            });
        }

        function checkCalibrationComplete() {
            let allCorrect = true;
            for (let i = 0; i < 4; i++) { if (calPlaced[i] !== calLinesData[i].correct) { allCorrect = false; break; } }
            if (!allCorrect) return;
            isModalBusy = true;
            document.getElementById('cal-status-msg').textContent = "¡CALIBRACIÓN EXITOSA! ACCEDIENDO A EL CICLO DE QUIMERA...";

        function startHelicoidalSequence() {
            return (async () => {
                try {
                    helicoidalSequenceRunning = true;
                    saveFocus();
                    subModalTextWindow.style.display = 'none';
                    subImg.style.display = 'block';
                    subModalXBtn.style.display = 'block';
                    subModalWindowBox.classList.remove('tv-off', 'tv-on');
                    subModal.classList.add('show');
                    subModal.setAttribute('aria-hidden', 'false');
                    document.body.classList.add('blurring-content');
                    subModalWindowBox.classList.remove('ecq-clean-mode');
                    subModalWindowBox.classList.add('tv-on');
                    announce('Reproduciendo la secuencia del Modelo Helicoidal del Desarrollo del Conocimiento.');
                    setTimeout(() => subModalXBtn.focus(), 450);
                    const images = ['01-borrador_T-P.webp', '02-Teoria-Preg.webp', '03-HECE.webp', '04-MHDC.webp'];
                    for (let i = 0; i < images.length; i++) {
                        if (!helicoidalSequenceRunning) return;
                        subImg.style.opacity = '0';
                        await new Promise(r => setTimeout(r, 600));
                        if (!helicoidalSequenceRunning) return;
                        subImg.src = images[i];
                        await new Promise(resolve => {
                            const done = () => { subImg.onload = null; subImg.onerror = null; resolve(); };
                            if (subImg.complete && subImg.naturalWidth > 0) { done(); }
                            else { subImg.onload = done; subImg.onerror = done; }
                        });
                        if (!helicoidalSequenceRunning) return;
                        subImg.style.opacity = '1';
                        await new Promise(r => setTimeout(r, 2000));
                        if (!helicoidalSequenceRunning) return;
                        if (i === images.length - 1) {
                            subImg.style.opacity = '0';
                            await new Promise(r => setTimeout(r, 600));
                            if (!helicoidalSequenceRunning) return;
                            showHelicoidalTextWindow();
                            return;
                        }
                    }
                } catch (err) {
                    console.error('[Quimera] helicoidal sequence error:', err);
                    helicoidalSequenceRunning = false;
                }
            })();
        }

        async function showHelicoidalTextWindow() {
            try {
                subImg.style.display = 'none';
                subModalXBtn.style.display = 'block';
                subModalTextWindow.style.display = 'block';
                subModalTextWindow.classList.remove('tv-off');
                subModalTextWindow.classList.add('tv-on');
                isSubModalBusy = true;
                const paragraphs = [
                    "Representa el conocimiento como un proceso continuo de transformación. Una teoría o comprensión previa permite interpretar la realidad, pero al enfrentarse con nuevos fenómenos surgen problemas, contradicciones o interrogantes que cuestionan sus límites.",
                    "El análisis permite investigar y construir respuestas; la revisión somete esas respuestas a criterios de rigor, coherencia y evidencia; y la transferencia incorpora el nuevo conocimiento a la comprensión existente.",
                    "Sin embargo, el proceso no termina con la solución. Cada problema resuelto genera nuevas preguntas, y las nuevas preguntas permiten acceder a problemas de mayor complejidad.",
                    "Por ello, el conocimiento no se desarrolla en círculos que regresan al mismo punto, sino mediante una hélice ascendente: cada ciclo conserva, transforma y amplía lo aprendido, conduciendo hacia niveles progresivamente más profundos de comprensión.",
                    "Resolver un problema no es el final del conocimiento; es el comienzo de una pregunta mejor."
                ];
                const formattedContent = paragraphs.map(text => ({ type: 'p', text }));
                await animateModalContent(subModalTitle, subModalBody, subModalCloseBtn, "MODELO HELICOIDAL DEL DESARROLLO DEL CONOCIMIENTO.", formattedContent);
                isSubModalBusy = false;
                setTimeout(() => subModalCloseBtn.focus(), 50);
            } catch (err) {
                console.error('[Quimera] showHelicoidalTextWindow error:', err);
                isSubModalBusy = false;
            }
        }

        const triggerHelicoidalTextClose = () => {
            if (subModalTextWindow.classList.contains('tv-off') || isSubModalBusy) return;
            subModalTextWindow.classList.remove('tv-on');
            subModalTextWindow.classList.add('tv-off');
            setTimeout(() => {
                subModalTextWindow.style.display = 'none';
                subModalTextWindow.classList.remove('tv-off');
                subModalTitle.textContent = '';
                subModalBody.innerHTML = '';
                subModalCloseBtn.className = 'laser-burn-effect continuar-btn';
                subModalCloseBtn.textContent = 'CONTINUAR';
                subImg.style.opacity = '0';
                subImg.src = '04-MHDC.webp';
                subImg.style.display = 'block';
                subModalXBtn.style.display = 'block';
                setTimeout(() => { subImg.style.opacity = '1'; }, 50);
                setTimeout(() => subModalXBtn.focus(), 100);
            }, 500);
        };
        subModalCloseBtn.addEventListener('click', (e) => { e.stopPropagation(); if (!isSubModalBusy) triggerHelicoidalTextClose(); });
        subModalXBtn.addEventListener('click', () => { closeSubModal(); });

        function closeSubModal() {
            helicoidalSequenceRunning = false;
            isSubModalBusy = false;
            subModalWindowBox.classList.remove('tv-on', 'ecq-clean-mode');
            subModalWindowBox.classList.add('tv-off');
            subModal.classList.remove('show');
            subModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('blurring-content');
            subImg.style.opacity = '0';
            setTimeout(() => {
                subModalWindowBox.classList.remove('tv-off');
                subModalTextWindow.style.display = 'none';
                subModalTextWindow.classList.remove('tv-off', 'tv-on');
            }, 500);
            restoreFocus();
        }
        subModal.addEventListener('click', (e) => {
            if (e.target !== subModal) return;
            if (subModalTextWindow.style.display === 'block') {
                if (!isSubModalBusy) triggerHelicoidalTextClose();
            } else {
                closeSubModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (subModal.classList.contains('show')) {
                if (subModalTextWindow.style.display === 'block') { if (!isSubModalBusy) triggerHelicoidalTextClose(); }
                else closeSubModal();
                return;
            }
            if (calibrationModal.classList.contains('show') && !isModalBusy) {
                closeCalibrationModal();
                return;
            }
            if (mainModal.classList.contains('show') && !isModalBusy) {
                triggerTVClose();
            }
        });

        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', async (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;" aria-hidden="true">🎵</span> Música: OFF';
                audioToggle.setAttribute('aria-pressed', 'false');
                isMusicPlaying = false;
            } else {
                try {
                    await music.play();
                    audioToggle.innerHTML = '<span style="color: #ffffff;" aria-hidden="true">🎶</span> Música: ON';
                    audioToggle.setAttribute('aria-pressed', 'true');
                    isMusicPlaying = true;
                } catch (error) {
                    console.warn('[Quimera] No se pudo reproducir audio:', error);
                    audioToggle.innerHTML = '<span style="color: #ffffff;" aria-hidden="true">🎵</span> Música: OFF';
                    audioToggle.setAttribute('aria-pressed', 'false');
                    isMusicPlaying = false;
                }
            }
        });
        music.addEventListener('error', () => {
            console.warn('[Quimera] Error al cargar el archivo de audio.');
            isMusicPlaying = false;
            audioToggle.innerHTML = '<span style="color: #ffffff;" aria-hidden="true">🎵</span> Música: OFF';
            audioToggle.setAttribute('aria-pressed', 'false');
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                const req = document.documentElement.requestFullscreen
                    || document.documentElement.webkitRequestFullscreen
                    || document.documentElement.msRequestFullscreen;
                if (req) {
                    Promise.resolve(req.call(document.documentElement))
                        .then(() => { fullscreenToggle.textContent = '❌ Salir Pantalla Completa'; })
                        .catch(err => console.warn('[Quimera] Fullscreen error:', err));
                }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) {
                    Promise.resolve(exit.call(document))
                        .then(() => { fullscreenToggle.textContent = '⛶ Pantalla Completa'; })
                        .catch(err => console.warn('[Quimera] Exit fullscreen error:', err));
                }
            }
        });
        document.addEventListener('fullscreenchange', () => {
            fullscreenToggle.textContent = !document.fullscreenElement ? '⛶ Pantalla Completa' : '❌ Salir Pantalla Completa';
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (matrixInterval) { clearInterval(matrixInterval); matrixInterval = null; }
            } else if (matrixShouldRun && !matrixInterval) {
                startMatrixRain();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');
            async function runEntranceSequence() {
                try {
                    overlay.style.backgroundColor = '#ffffff';
                    overlay.style.opacity = '1';
                    await new Promise(r => setTimeout(r, 150));
                    overlay.style.backgroundColor = '#000000';
                    await new Promise(r => setTimeout(r, 600));
                    document.getElementById('bg-layer').style.opacity = '1';
                    document.getElementById('cursor-light-glow').classList.add('visible');
                    overlay.style.opacity = '0';
                    await new Promise(r => setTimeout(r, 500));
                    document.querySelector('.top-bar').style.opacity = '1';
                    await new Promise(r => setTimeout(r, 200));
                    const brandLogo = document.querySelector('.brand-logo');
                    brandLogo.textContent = brandLogo.dataset.text;
                    brandLogo.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    brandLogo.classList.remove('active-laser');
                    brandLogo.classList.add('revealed', 'hologram-mode');
                    const audioToggleBtn = document.getElementById('audio-toggle');
                    audioToggleBtn.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    audioToggleBtn.classList.remove('active-laser');
                    audioToggleBtn.classList.add('revealed', 'hologram-mode');
                    const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
                    fullscreenToggleBtn.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    fullscreenToggleBtn.classList.remove('active-laser');
                    fullscreenToggleBtn.classList.add('revealed', 'hologram-mode');
                    const line1Container = document.getElementById('header-line1-container');
                    line1Container.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    line1Container.classList.remove('active-laser');
                    line1Container.classList.add('revealed', 'hologram-mode');
                    const wordQuimeraContainer = document.getElementById('word-quimera-container');
                    wordQuimeraContainer.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    wordQuimeraContainer.classList.remove('active-laser');
                    wordQuimeraContainer.classList.add('revealed', 'hologram-mode');
                    centralCard.style.display = 'block';
                    cardTitleText.textContent = '';
                    centralCard.classList.add('tv-on-card');
                    await new Promise(r => setTimeout(r, 400));
                    await updateCardTitleLaser(storyData[0].title);
                    isCardBusy = false;
                    setTimeout(() => centralCard.focus(), 50);
                    const mainFooter = document.getElementById('main-footer');
                    const footerText = document.getElementById('footer-text');
                    footerText.textContent = footerText.dataset.text.replace('2026', new Date().getFullYear());
                    mainFooter.classList.add('active-laser');
                    await new Promise(r => setTimeout(r, 600));
                    mainFooter.classList.remove('active-laser');
                    mainFooter.classList.add('revealed', 'hologram-mode');
                } catch (err) {
                    console.error('[Quimera] entrance sequence error:', err);
                    isCardBusy = false;
                }
            }
            runEntranceSequence();
            const brandLogoLink = document.querySelector('.brand-logo');
            if (brandLogoLink) {
                brandLogoLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const introOverlay = document.getElementById('intro-overlay');
                    introOverlay.style.backgroundColor = '#ffffff';
                    introOverlay.style.opacity = '1';
                    setTimeout(() => { window.location.href = "https://quimerac3.github.io/"; }, 1000);
                });
            }
        });
    </script>
</body>
</html>
